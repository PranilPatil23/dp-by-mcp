<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Account Statement</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="account-card">
    <h2 class="account-title">HOME LOAN STATEMENT</h2>
    <div class="details-column">
      <div class="detail-row">
        <span class="detail-label">Loan Account No</span>
        <span class="detail-colon">:</span>
        <span class="detail-value">HL-998810239</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Borrower Name</span>
        <span class="detail-colon">:</span>
        <span class="detail-value">Pranil Patil</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Sanctioned Amount</span>
        <span class="detail-colon">:</span>
        <span class="detail-value">₹50,00,000.00</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Interest Rate</span>
        <span class="detail-colon">:</span>
        <span class="detail-value">8.5% p.a.</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">EMI Amount</span>
        <span class="detail-colon">:</span>
        <span class="detail-value">₹43,391.00</span>
      </div>
    </div>
  </div>
</body>
</html>
