<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Statement</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-statement">
    <div class="card-hero">
      <div class="card-chip"></div>
      <h2 class="card-type">PLATINUM CREDIT CARD</h2>
      <div class="card-num">4532 •••• •••• 9812</div>
      <div class="card-holder">
        <span>CARD HOLDER</span>
        <strong class="holder-name">RAVI KINGER</strong>
      </div>
    </div>

    <div class="billing-summary">
      <div class="bill-col">
        <span class="bill-lbl">Total Amount Due</span>
        <span class="bill-val due-amount">₹24,850.00</span>
      </div>
      <div class="bill-col">
        <span class="bill-lbl">Minimum Due</span>
        <span class="bill-val min-due">₹2,500.00</span>
      </div>
      <div class="bill-col">
        <span class="bill-lbl">Payment Due Date</span>
        <span class="bill-val due-date">15 Oct 2026</span>
      </div>
      <div class="bill-col">
        <span class="bill-lbl">Reward Points</span>
        <span class="bill-val reward-pts">12,450 pts</span>
      </div>
    </div>

    <div class="limits-bar">
      <div class="limit-item">
        <span>Credit Limit: <strong class="cred-limit">₹2,00,000</strong></span>
      </div>
      <div class="limit-item">
        <span>Available Credit: <strong class="avail-limit">₹1,75,150</strong></span>
      </div>
      <div class="limit-item">
        <span>Cash Limit: <strong class="cash-limit">₹50,000</strong></span>
      </div>
    </div>
  </div>
</body>
</html>
